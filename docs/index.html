<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Living Simulator AI - Legal & Support</title>
    <style>
        :root {
            --bg-color: #0c0f17;
            --card-bg: #141926;
            --accent-color: #22d3ee;
            --accent-gold: #f59e0b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            max-width: 540px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 36px;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
        }
        h1 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 28px;
        }
        .btn-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: block;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background: rgba(34, 211, 238, 0.12);
            border-color: var(--accent-color);
            color: var(--accent-color);
            transform: translateY(-2px);
        }
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Living Simulator AI</h1>
        <p>Official Legal Documents & App Store Disclosures</p>
        <div class="btn-list">
            <a class="btn" href="privacy.html">📄 Privacy Policy</a>
            <a class="btn" href="terms.html">⚖️ Terms of Use (EULA)</a>
        </div>
        <div class="footer">
            &copy; 2026 Living Simulator AI. All rights reserved.
        </div>
    </div>
</body>
</html>
